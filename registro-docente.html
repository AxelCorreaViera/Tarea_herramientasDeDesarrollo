<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de docente - Gestión Estudiantil</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="header">
        <div class="container">
            <div class="logo">
                <h1>Gestión Estudiantil</h1>
                <p>Registro de docente</p>
            </div>

            <nav class="nav">
                <a href="index.html">Inicio</a>
                <a href="login.html">Iniciar sesión</a>
            </nav>
        </div>
    </header>

    <main class="pagina-formulario">
        <div class="container">

            <div class="formulario-header">
                <span class="badge">CUENTA DOCENTE</span>
                <h2>Registrar docente</h2>
                <p>
                    Crea una cuenta para acceder al sistema de gestión de estudiantes.
                </p>
            </div>

            <form id="formularioDocente" class="formulario">

                <div class="formulario-seccion">
                    <h3>Datos personales</h3>

                    <div class="form-grid">

                        <div class="campo">
                            <label for="nombre">Nombre</label>
                            <input type="text" id="nombre" name="nombre" placeholder="Ingrese su nombre">
                        </div>

                        <div class="campo">
                            <label for="apellido">Apellido</label>
                            <input type="text" id="apellido" name="apellido" placeholder="Ingrese su apellido">
                        </div>

                        <div class="campo">
                            <label for="correo">Correo electrónico</label>
                            <input type="email" id="correo" name="correo" placeholder="ejemplo@correo.com">
                        </div>

                        <div class="campo">
                            <label for="telefono">Teléfono</label>
                            <input type="tel" id="telefono" name="telefono" placeholder="Ingrese su teléfono">
                        </div>

                    </div>
                </div>

                <div class="formulario-seccion">
                    <h3>Datos de acceso</h3>

                    <div class="form-grid">

                        <div class="campo">
                            <label for="contrasena">Contraseña</label>
                            <input type="password" id="contrasena" name="contrasena"
                                placeholder="Ingrese una contraseña">
                        </div>

                        <div class="campo">
                            <label for="confirmarContrasena">
                                Confirmar contraseña
                            </label>
                            <input type="password" id="confirmarContrasena" name="confirmarContrasena"
                                placeholder="Repita su contraseña">
                        </div>

                    </div>
                </div>

                <div class="formulario-acciones">
                    <a href="login.html" class="btn-secundario">
                        Volver al inicio de sesión
                    </a>

                    <button type="submit" class="btn">
                        Crear cuenta
                    </button>
                </div>

            </form>

        </div>
    </main>

    <footer class="footer">
        <div class="container">
            <p>&copy; 2026 Gestión Estudiantil. Todos los derechos reservados.</p>
        </div>
    </footer>
<script src="script.js"></script>
</body>

</html>
