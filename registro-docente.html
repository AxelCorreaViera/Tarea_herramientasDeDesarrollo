
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de docente - Gestión Estudiantil</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="header">
        <div class="container header-content">

            <div class="logo">
                <div>
                    <h1>Gestión Estudiantil</h1>
                    <p>Registro de docente</p>
                </div>
            </div>

            <nav class="nav">
                <a href="index.html">Inicio</a>
            </nav>

        </div>
    </header>

    <main class="pagina-formulario">

        <div class="container pad">

            <div class="section-title">
                <h2>Crear cuenta docente</h2>
            </div>

            <div class="formulario-card">

                <form id="formularioDocente">

                    <div class="campo">
                        <label for="nombre">Nombre</label>
                        <input
                            type="text"
                            id="nombre"
                            name="nombre"
                            placeholder="Ingrese su nombre"
                            autocomplete="given-name"
                            required>
                    </div>

                    <div class="campo">
                        <label for="apellido">Apellido</label>
                        <input
                            type="text"
                            id="apellido"
                            name="apellido"
                            placeholder="Ingrese su apellido"
                            autocomplete="family-name"
                            required>
                    </div>

                    <div class="campo">
                        <label for="correo">Correo electrónico</label>
                        <input
                            type="email"
                            id="correo"
                            name="correo"
                            placeholder="correo@ejemplo.com"
                            autocomplete="email"
                            required>
                    </div>

                    <div class="campo">
                        <label for="telefono">Teléfono</label>
                        <input
                            type="tel"
                            id="telefono"
                            name="telefono"
                            placeholder="Ingrese su teléfono"
                            autocomplete="tel"
                            required>
                    </div>

                    <div class="campo">
                        <label for="contrasena">Contraseña</label>
                        <input
                            type="password"
                            id="contrasena"
                            name="contrasena"
                            placeholder="Cree una contraseña"
                            autocomplete="new-password"
                            minlength="8"
                            required>
                    </div>

                    <div class="campo">
                        <label for="confirmarContrasena">Confirmar contraseña</label>
                        <input
                            type="password"
                            id="confirmarContrasena"
                            name="confirmarContrasena"
                            placeholder="Repita su contraseña"
                            autocomplete="new-password"
                            minlength="8"
                            required>
                    </div>

                    <button type="submit" class="btn">
                        Crear cuenta
                    </button>

                </form>

                <div class="registro">
                    <p>¿Ya tienes una cuenta?</p>
                    <a href="login.html">Inicia sesión aquí</a>
                </div>

            </div>

        </div>

    </main>

    <footer class="footer">
        <div class="container">
            <p>© 2026 Sistema de Gestión de Estudiantes</p>
            <p>Proyecto académico - Herramientas de Desarrollo</p>
        </div>
    </footer>

    <script src="script.js"></script>

</body>

</html>
