```html
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <h2 class="pad">Iniciar Sesión</h2>

    <form class="pad">

        <div class="campo">
            <label for="correo">Correo electrónico</label>
            <input 
                type="email" 
                id="correo"
                name="correo"
                placeholder="correo@ejemplo.com"
                autocomplete="email"
                required>
        </div>

        <div class="campo">
            <label for="contrasena">Contraseña</label>
            <input 
                type="password" 
                id="contrasena"
                name="contrasena"
                placeholder="Ingrese su contraseña"
                autocomplete="current-password"
                required>
        </div>

        <button type="submit" class="btn">
            Iniciar Sesión
        </button>

        <div class="registro">
            <p>¿No tienes una cuenta?</p>
            <a href="formulario.html">Regístrate aquí</a>
        </div>

    </form>

</div>

</body>
</html>
```
