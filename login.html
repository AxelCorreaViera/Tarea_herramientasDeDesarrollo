<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="header">
        <div class="container header-content">

            <div class="logo">
                <div>
                    <h1>Gestión Estudiantil</h1>
                    <p>Acceso al sistema</p>
                </div>
            </div>

            <nav class="nav">
                <a href="index.html">Inicio</a>
                <a href="login.html" class="active">Iniciar sesión</a>
            </nav>

        </div>
    </header>

    <main class="pagina-formulario">

        <div class="container">

            <div class="section-title">
                <span>ACCESO</span>

                <h2>Iniciar sesión</h2>

                <p>
                    Ingrese sus datos para acceder al sistema.
                </p>
            </div>

            <div class="formulario-card">

                <form id="formularioLogin">

                    <div class="campo">
                        <label for="correo">Correo electrónico</label>

                        <input type="email" id="correo" name="correo" placeholder="correo@ejemplo.com"
                            autocomplete="email" required>
                    </div>

                    <div class="campo">
                        <label for="contrasena">Contraseña</label>

                        <input type="password" id="contrasena" name="contrasena" placeholder="Ingrese su contraseña"
                            autocomplete="current-password" required>
                    </div>

                    <button type="submit" class="btn">
                        Iniciar sesión
                    </button>

                </form>

                <div class="registro">
                    <p>¿No tienes una cuenta?</p>

                    <a href="registro-docente.html">
                        Regístrate aquí
                    </a>
                </div>

            </div>

        </div>

    </main>

    <footer class="footer">
        <div class="container">
            <p>© 2026 Sistema de Gestión de Estudiantes</p>
            <p>Proyecto académico - Herramientas de Desarrollo</p>
        </div>
    </footer>
<script src="script.js"></script>
</body>

</html>
