<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registro de Estudiantes</title>
</head>

<body>

<h2>Registrar estudiante</h2>

<form>

    <label>Nombre:</label>
    <input type="text" id="nombre">

    <br><br>

    <label>Apellido:</label>
    <input type="text" id="apellido">

    <br><br>

    <br><br>

    <button type="submit">
        Registrar
    </button>

</form>

</body>
</html>
