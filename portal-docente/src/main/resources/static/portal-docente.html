<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Docente</title>
    <link rel="stylesheet" href="portal-docente.css">
    <script src="portal-docente.js" defer></script>
</head>
<body>
    <header class="encabezado">
        <div>
            <h1>Portal Docente</h1>
            <p>Gestión académica de tus cursos</p>
        </div>
        <span class="estado">Sistema académico</span>
    </header>

    <main class="contenedor">
        <section class="bienvenida">
            <h2>Mis cursos asignados</h2>
            <p>Selecciona un curso para consultar a sus estudiantes matriculados.</p>
        </section>

        <p id="mensaje" class="mensaje" role="status">Cargando cursos...</p>

        <section>
            <div id="listaCursos" class="lista-cursos"></div>
        </section>

        <section id="seccionEstudiantes" class="panel" hidden>
            <h2 id="tituloCurso">Estudiantes matriculados</h2>
            <p id="detalleCurso"></p>

            <div class="tabla-contenedor">
                <table>
                    <thead>
                        <tr>
                            <th>Código</th>
                            <th>Apellidos y nombres</th>
                            <th>Correo</th>
                        </tr>
                    </thead>
                    <tbody id="tablaEstudiantes"></tbody>
                </table>
            </div>

            <p id="mensajeEstudiantes" class="mensaje"></p>
        </section>
    </main>

    <footer>
        Portal Docente · Proyecto académico
    </footer>
</body>
</html>
